<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>黒線 -KOKUSEN- — 規約・ポリシー</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #050505;
    --fg: #e8e8e8;
    --dim: #999;
    --faint: #666;
    --accent: #ff1111;
    --border: #333;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    line-height: 1.7;
  }
  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 60px 24px 80px;
  }
  h1 {
    font-size: 14px;
    letter-spacing: 0.4em;
    color: var(--dim);
    font-weight: 400;
    margin: 0 0 8px;
  }
  .title {
    font-size: 64px;
    font-weight: 900;
    letter-spacing: 0.3em;
    margin: 0 0 8px;
    color: #fff;
    text-shadow: 0 0 60px rgba(255, 17, 17, 0.2);
  }
  .subtitle {
    font-size: 11px;
    letter-spacing: 0.3em;
    color: var(--faint);
    margin: 0 0 60px;
  }
  nav { margin-top: 40px; }
  nav a {
    display: block;
    padding: 18px 20px;
    margin-bottom: 12px;
    border: 1px solid var(--border);
    color: var(--dim);
    text-decoration: none;
    font-size: 13px;
    letter-spacing: 0.3em;
    transition: all 0.15s ease;
  }
  nav a:hover, nav a:focus {
    border-color: var(--accent);
    color: var(--accent);
  }
  nav a .arrow {
    float: right;
    color: var(--faint);
  }
  footer {
    margin-top: 80px;
    padding-top: 24px;
    border-top: 1px solid var(--border);
    color: var(--faint);
    font-size: 11px;
    letter-spacing: 0.1em;
  }
</style>
</head>
<body>
<main>
  <h1>- K O K U S E N -</h1>
  <p class="title">黒 線</p>
  <p class="subtitle">臨界の一瞬を、打て。</p>

  <nav>
    <a href="terms/">利 用 規 約 <span class="arrow">›</span></a>
    <a href="privacy/">プ ラ イ バ シ ー ポ リ シ ー <span class="arrow">›</span></a>
  </nav>

  <footer>
    発行者: ONIGIRIBOYS<br>
    お問い合わせ: <a href="mailto:k666801@gmail.com" style="color:var(--dim)">k666801@gmail.com</a>
  </footer>
</main>
</body>
</html>
